<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Espelham --background dos temas claro (#fafafa) e escuro (#0a0a0a) em src/styles/globals.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="hsl(0 0% 98%)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="hsl(0 0% 3.9%)" />
    <meta name="description" content="Editor LaTeX com revisão por versões, diff visual em PDF e assistente de IA." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>OverDocTeX</title>
    <script>
      // Tema e idioma antes do primeiro desenho, para a página não piscar no tema errado
      // nem o navegador oferecer tradução por engano. Mesma regra e mesmas chaves de
      // src/lib/theme.ts e src/lib/i18n/locale.ts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('overdoctex.theme') || 'system';
        } catch (error) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // Idioma: mesma regra de src/lib/i18n/locale.ts (sistema; fora de pt, es e en, inglês).
        var locale = 'system';
        try {
          locale = localStorage.getItem('overdoctex.locale') || 'system';
        } catch (error) {}
        if (locale !== 'pt-BR' && locale !== 'en' && locale !== 'es') {
          var language = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
          locale = language.indexOf('pt') === 0 ? 'pt-BR' : language.indexOf('es') === 0 ? 'es' : 'en';
        }
        document.documentElement.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
